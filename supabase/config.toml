project_id = "fkeyentcklsuqecqgmak"

[auth]
site_url = "https://serkle-app-five.vercel.app"
additional_redirect_urls = [
  "https://serkle-app-five.vercel.app/**",
  "https://serkle-app.vercel.app/**",
  "http://localhost:8082/**",
]

[auth.email]
enabled = true
enable_confirmations = true
otp_length = 6
otp_expiry = 3600
max_frequency = "60s"

[auth.sms]
enabled = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

# Supabase Auth signs every request to this HTTP hook with a Standard Webhooks
# secret. The secret is injected only while applying remote configuration and
# is also stored as SEND_EMAIL_HOOK_SECRET for the Edge Function.
[auth.hook.send_email]
enabled = true
uri = "https://fkeyentcklsuqecqgmak.supabase.co/functions/v1/send-email"
secrets = "env(SUPABASE_AUTH_HOOK_SEND_EMAIL_SECRET)"

[functions.moderate-content]
verify_jwt = false

[functions.send-push-notification]
verify_jwt = true

[functions.save-push-subscription]
verify_jwt = true

[functions.chapa-initialize]
verify_jwt = true

[functions.chapa-verify]
verify_jwt = true

[functions.chapa-webhook]
verify_jwt = false

# Checks either the user JWT or a dedicated scheduler secret inside the handler.
[functions.chapa-reconcile]
verify_jwt = false

[functions.chapa-transfer]
verify_jwt = true

# The image gateway verifies the user's JWT with Auth or checks a dedicated
# maintenance secret. This also supports the newer publishable API keys.
[functions.image-previews]
verify_jwt = false
import_map = "./functions/image-previews/deno.json"

# Supabase Auth signs Send SMS Hook requests with Standard Webhooks. The
# function verifies that signature itself, so no user JWT is expected here.
[functions.send-sms]
verify_jwt = false

# Supabase Auth signs this hook with Standard Webhooks. No end-user JWT is sent.
[functions.send-email]
verify_jwt = false

# Server-to-server only. The handler requires MAILER_INTERNAL_SECRET and accepts
# only allowlisted templates, never arbitrary email HTML.
[functions.send-notification-email]
verify_jwt = false
